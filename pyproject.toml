[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnsched"
version = "0.1.0"
description = "LearnSched: PPO-based adaptive tuning of MLFQ CPU scheduling parameters"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "gymnasium", "stable-baselines3", "torch",
                "matplotlib", "plotly", "streamlit"]

[tool.setuptools.packages.find]
include = ["learnsched*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
